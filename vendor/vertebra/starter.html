  <!-- Apply stored/OS theme before first paint (no light-theme flash).
       To default off the VISITOR'S CLOCK instead of their OS setting, put
       data-theme-default="clock" on <html> and swap the media query for the
       commented line below — the rule has to run here, pre-paint, or the page
       lands in the wrong theme for a frame. theme.js uses the same boundaries
       (dark 19:00-07:00) and exports vertebra.darkByClock(). -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("vertebra-theme") || localStorage.getItem("sentinel-theme");
        var dark = matchMedia("(prefers-color-scheme: dark)").matches;
        /* clock default: var h = new Date().getHours(); dark = h >= 19 || h < 7; */
        if (t === "dark" || (!t && dark))
          document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) { /* ignore */ }
    })();
  </script>

  <!-- Keep only the pairing you chose (this is A · Standard).
       B: Chakra+Petch / Share+Tech+Mono   C: Rajdhani / JetBrains+Mono
       D: Michroma / IBM+Plex+Sans / Space+Mono
       E: Pixelify+Sans / Space+Mono / Silkscreen (kawaii Y2K)
       F: Fraunces / Karla / DM+Mono (warm, unhurried)
       Then set data-font="b|c|d|e|f" on <html> if not using A. -->
